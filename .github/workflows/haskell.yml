---
name: haskell reconstruct-strings

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Haskell GHC and Cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6.7"
          cabal-version: "latest"

      - name: Cache Cabal store and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            dist-newstyle
          key: >-
            ${{ runner.os }}-cabal-${{
              hashFiles('reconstruct-strings.cabal')
            }}
          restore-keys: |
            ${{ runner.os }}-cabal-

      - name: Update Hackage index
        run: cabal update

      - name: Validate Cabal configuration
        run: cabal check

      - name: Build project
        run: cabal build --enable-tests --enable-benchmarks

      - name: Run test suite
        run: cabal test --test-show-details=direct

      - name: Run sample reconstruction
        run: |
          cabal run reconstruct-strings -- -m 2 ATGGC GGCGT CGTGCA
          cabal run reconstruct-strings -- -m 2 ABC BCD CDE
